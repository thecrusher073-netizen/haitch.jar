name: Build HaitchL jar

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haitchl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: HaitchL-jar
          path: haitchl/build/libs/haitchl-*.jar
